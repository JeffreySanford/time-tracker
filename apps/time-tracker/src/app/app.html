<div class="app-container" 
     (touchstart)="onTouchStart($event)"
     (touchmove)="onTouchMove($event)" 
     (touchend)="onTouchEnd()">
  
  <app-header 
    [selectedRange]="selectedRange"
    [currentDateDisplay]="currentDateDisplay"
    [totalTimeDisplay]="totalTimeDisplay"
    [unreadMessages]="unreadMessages"
    [showUserMenu]="showUserMenu"
    (rangeChange)="onRangeChange()"
    (userMenuToggle)="toggleUserMenu()">
  </app-header>
  
  <!-- Navigation Arrows (Desktop Only) -->
  <div class="nav-arrows">
    <button 
      class="nav-arrow left" 
  *ngIf="(currentView === 'home' && showLeftArrow) || currentView === 'reports'"
    (click)="handleLeftClick()"
    [attr.aria-label]="currentView === 'home' ? 'Go to Planning' : 'Back to Home'">
      ←
    </button>
    
    <button 
      class="nav-arrow right" 
  *ngIf="(currentView === 'home' && showRightArrow) || currentView === 'planning'"
    (click)="handleRightClick()"
    [attr.aria-label]="currentView === 'home' ? 'Go to Reports' : 'Back to Home'">
      →
    </button>
  </div>

  <!-- Swipeable View Container -->
  <div class="view-container" [attr.data-view]="currentView">
    
    <!-- Reports View -->
    <div class="view-panel reports" [class.active]="currentView === 'reports'">
      <app-reports
        [projects]="projects"
        [tasks]="allTasks"
        [selectedProject]="selectedProject"
        (projectChange)="onProjectChange($event)">
      </app-reports>
    </div>
    
    <!-- Home View -->
    <div class="view-panel home" [class.active]="currentView === 'home'">
      <app-home
        [projects]="projects"
        [allTasks]="allTasks"
        [selectedProject]="selectedProject"
        (projectChange)="onProjectChange($event)"
        (taskUpdate)="onTaskUpdate($event)"
        (taskDelete)="onTaskDelete($event)">
      </app-home>
    </div>
    
    <!-- Planning View -->
    <div class="view-panel planning" [class.active]="currentView === 'planning'">
      <app-planning
        [projects]="projects"
        [allTasks]="allTasks"
        [selectedProject]="selectedProject"
        (projectChange)="onProjectChange($event)"
        (taskUpdate)="onTaskUpdate($event)"
        (taskDelete)="onTaskDelete($event)">
      </app-planning>
    </div>
    
  </div>

  <!-- System Status Component -->
  <app-system-status 
    [currentView]="currentView"
    (viewChange)="onViewChange($event)">
  </app-system-status>

  <app-footer 
    [isConnected]="isConnected"
    [pingTime]="pingTime"
    (pingServer)="pingServer()">
  </app-footer>

</div>
