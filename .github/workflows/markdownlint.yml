name: Markdown Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run markdownlint (tracked files only)
        run: |
          git ls-files -z -- "*.md" | xargs -0 -n 50 npx markdownlint-cli2 -c .markdownlint.json
